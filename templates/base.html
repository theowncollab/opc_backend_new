<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RF9XCV2ZMN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-RF9XCV2ZMN');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.10/dist/lenis.css">
    <!-- Fonts: Anek Latin (headings, variable width) and Mukta (text), both by Ek Type; Cedarville for signatures -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Mukta:wght@400;500;600;700&family=Cedarville+Cursive&display=swap">
    <!-- Shared design tokens (source: dashboard-app/src/styles/tokens.css), then the site's own layer -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/site.css?v=2">
    <link rel="stylesheet" href="/static/css/header.css?v=2">
    <link rel="stylesheet" href="/static/css/footer.css?v=2">
    <link rel="stylesheet" href="/static/css/motion.css?v=1">
    <!-- icon for page -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicons/favicon.ico">
    <script>
        window.API_BASE_URL = "{{ API_BASE_URL }}";
        window.WEB_APP_URL = "{{ WEB_APP_URL }}";
        window.DASHBOARD_URL = "{{ DASHBOARD_URL }}";
    </script>
    <title>{% block title %}OPC{% endblock %}</title>
    {% block style %}{% endblock %}
</head>

<body>

    <!-- Header Section Start -->
    {% include "header.html" %}
    <!-- Header Section End -->

    <!-- Main Content Start -->
    <main id="main">
    {% block content %}{% endblock %}
    </main>
    <!-- Main Content End -->

    <!-- Marquee Start -->
    <div id="marquee" aria-hidden="true">
        <div id="marquee-container">
            <div class="marquee-track">
                <div class="marquee-item">Brands</div>
                <div class="marquee-item">Creators</div>
                <div class="marquee-item">Event partners</div>
                <div class="marquee-item">OPC</div>
                <div class="marquee-item">Brands</div>
                <div class="marquee-item">Creators</div>
                <div class="marquee-item">Event partners</div>
                <div class="marquee-item">OPC</div>
                <div class="marquee-item">Brands</div>
                <div class="marquee-item">Creators</div>
                <div class="marquee-item">Event partners</div>
                <div class="marquee-item">OPC</div>
                <div class="marquee-item">Brands</div>
                <div class="marquee-item">Creators</div>
                <div class="marquee-item">Event partners</div>
                <div class="marquee-item">OPC</div>
            </div>
        </div>
    </div>
    <!-- Marquee End -->

    <!-- Footer Section Start -->
    {% include "footer.html" %}
    <!-- Footer Section End -->

    <script src="https://unpkg.com/lenis@1.3.10/dist/lenis.min.js"></script>
    <script src="/static/js/script.js"></script>
    <script src="/static/js/header.js"></script>
    <script src="/static/js/footer.js"></script>
    <script src="/static/js/mobile-menu.js?v=3"></script>
    <script src="/static/js/motion.js?v=1"></script>
    {% block script %}{% endblock %}
</body>

</html>
