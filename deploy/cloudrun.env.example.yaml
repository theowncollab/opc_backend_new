# Plain settings for the Cloud Run service (not secret). See DEPLOY.md, step 4 and section 5B.
#
# Copy this file to deploy/cloudrun.env.yaml (git ignores that name), fill it in,
# and pass it with:  --env-vars-file deploy/cloudrun.env.yaml
#
# The 5 secret values (SECRET_KEY, DB_USER, DB_PASSWORD, SMTP_PASSWORD, CRON_SECRET)
# do NOT go here: they live in Google Secret Manager and are attached with --set-secrets.
# PORT is set by Cloud Run itself: don't add it.

ENVIRONMENT: "PRODUCTION"            # anything but DEVELOPMENT (DEVELOPMENT allows localhost to call the API)

# Sign-in tokens
ALGORITHM: "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES: "15"
REFRESH_TOKEN_EXPIRE_DAYS: "7"

# Google sign-in and YouTube verification (public ID, same one the website uses)
GOOGLE_CLIENT_ID: "828246651523-ulnokv5h94loanmj3pd8t8ud6kc72ov5.apps.googleusercontent.com"

# Email sending (Gmail). The password is the Gmail *app password*, kept as a secret.
SMTP_SERVER: "smtp.gmail.com"
SMTP_PORT: "587"
SMTP_USER: "opc.owncollab@gmail.com"
MEET_FROM_EMAIL: "support@theowncollab.com"   # optional: the address shown to people booking a meeting

# Addresses (no trailing slash on WEB_APP_URL; DASHBOARD_URL ends with /)
WEB_APP_URL: "https://www.theowncollab.com"
DASHBOARD_URL: "https://dashboard.theowncollab.com/"
DASHBOARD_ORIGINS: "https://dashboard.theowncollab.com"   # comma-separated if more than one

# Team console owners (they can add the rest of the team from the console)
STAFF_OWNER_EMAILS: "ceo@theowncollab.com"
